<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSA Cipher</title>
  <style>
    :root {
      --bg:#000; --panel:#0a0a0a; --border:#242424; --border-h:#3a3a3a;
      --text:#f5f5f5; --dim:#8a8a8a; --btn:#fff; --btn-text:#000;
      --err:#ff6b6b; --ok:#69db7c; --mono:"Cascadia Code","Consolas","SF Mono",monospace;
    }
    html.light {
      --bg:#f4f4f5; --panel:#ffffff; --border:#dcdcde; --border-h:#b8b8bb;
      --text:#141416; --dim:#6b6b70; --btn:#111; --btn-text:#fff;
      --err:#c92a2a; --ok:#2b8a3e; --mono:"Cascadia Code","Consolas","SF Mono",monospace;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:"Segoe UI",system-ui,sans-serif; font-size:14px;
      transition:background .15s,color .15s;
    }
    .wrap { max-width:560px; margin:0 auto; padding:24px 20px 40px; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    h1 { font-size:18px; margin:0; font-weight:600; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab {
      flex:1; padding:9px; background:var(--panel); color:var(--dim);
      border:1px solid var(--border); border-radius:8px; cursor:pointer;
      font-size:13px; font-weight:500; transition:.15s;
    }
    .tab:hover { border-color:var(--border-h); color:var(--text); }
    .tab.active { background:var(--btn); color:var(--btn-text); border-color:var(--btn); }
    .panel { display:none; } .panel.active { display:block; }
    label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:12px 0 5px; }
    textarea, select {
      width:100%; background:var(--panel); color:var(--text);
      border:1px solid var(--border); border-radius:8px; padding:10px;
      font-family:var(--mono); font-size:13px; outline:none; resize:vertical; transition:border-color .15s;
    }
    textarea:focus, select:focus { border-color:var(--border-h); }
    textarea::placeholder { color:var(--dim); opacity:.6; }
    .msg { min-height:44px; }
    .key { min-height:120px; }
    .btn {
      padding:10px 18px; background:var(--btn); color:var(--btn-text);
      border:1px solid var(--btn); border-radius:8px; font-size:13px;
      font-weight:600; cursor:pointer; transition:.15s;
    }
    .btn:hover { opacity:.85; }
    .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    .btn.ghost:hover { border-color:var(--border-h); }
    .btn.icon { padding:7px 11px; }
    .row { display:flex; gap:10px; margin-top:14px; }
    .out { position:relative; }
    .out textarea { padding-right:60px; }
    .copy {
      position:absolute; top:8px; right:8px; background:transparent; border:none;
      color:var(--dim); cursor:pointer; font-size:12px; padding:2px 6px; border-radius:4px;
    }
    .copy:hover { color:var(--text); background:var(--border); }
    .status { font-size:12px; color:var(--dim); min-height:16px; margin-top:10px; }
    .status.error { color:var(--err); } .status.ok { color:var(--ok); }
    .hint { font-size:11px; color:var(--dim); margin-top:4px; }
    .hint code { font-family:var(--mono); font-size:10px; background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:0 3px; }
    #a-count { font-family:var(--mono); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>RSA Cipher</h1>
      <button class="btn ghost icon" id="theme" title="Toggle theme">🌙</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="auto">Auto-Generate</button>
      <button class="tab" data-tab="custom">Custom Key</button>
    </div>

    <!-- Auto-Generate -->
    <div class="panel active" id="panel-auto">
      <label for="a-in">Your message</label>
      <textarea id="a-in" class="msg" rows="3" placeholder="Type text to encrypt..." maxlength="190"></textarea>
      <div class="hint"><span id="a-count">0</span>/190 characters (RSA limit)</div>
      <div class="row">
        <button class="btn" id="a-go">Encrypt</button>
        <button class="btn ghost" id="a-clear">Clear</button>
      </div>
      <div class="status" id="a-status"></div>

      <div class="out">
        <label for="a-ct">Ciphertext</label>
        <textarea id="a-ct" readonly placeholder="Ciphertext appears here..."></textarea>
        <button class="copy" data-copy="a-ct">Copy</button>
      </div>

      <div class="out">
        <label for="a-key">Private key</label>
        <textarea id="a-key" class="key" readonly placeholder="Private key appears here..."></textarea>
        <button class="copy" data-copy="a-key">Copy</button>
        <div class="hint">This is your secret key. The <code>-----BEGIN/END-----</code> lines are part of it — keep the whole thing safe, you need it to decrypt.</div>
      </div>
    </div>

    <!-- Custom Key -->
    <div class="panel" id="panel-custom">
      <label for="c-mode">Mode</label>
      <select id="c-mode">
        <option value="encrypt">Encrypt (Public Key)</option>
        <option value="decrypt">Decrypt (Private Key)</option>
      </select>

      <label for="c-key" id="c-key-label">Public key (PEM)</label>
      <textarea id="c-key" class="key" placeholder="-----BEGIN PUBLIC KEY----- ..."></textarea>

      <label for="c-in" id="c-in-label">Plain text</label>
      <textarea id="c-in" class="msg" rows="3" placeholder="Text to encrypt..."></textarea>

      <div class="row">
        <button class="btn" id="c-go">Run</button>
        <button class="btn ghost" id="c-clear">Clear</button>
      </div>
      <div class="status" id="c-status"></div>

      <div class="out">
        <label for="c-out" id="c-out-label">Result</label>
        <textarea id="c-out" readonly placeholder="Result appears here..."></textarea>
        <button class="copy" data-copy="c-out">Copy</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>

</body>
</html>
